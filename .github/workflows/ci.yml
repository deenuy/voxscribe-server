name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check app/ tests/

      - name: Undefined names in app/ (F821)
        run: uv run ruff check app/ --select F821

      - name: Type check (pyright)
        run: uv run pyright app/

      - name: Unit tests (no I/O)
        run: uv run pytest tests/ tests/voice/unit/ -x -q -m "not integration and not room"

      - name: Contract drift check
        run: |
          uv run python -m contract.export --output-dir /tmp/contract-fresh
          for f in openapi.json events.json websocket.json errors.json; do
            diff "contract/$f" "/tmp/contract-fresh/$f" || (echo "contract/$f is out of sync. Run: uv run python -m contract.export" && exit 1)
          done
