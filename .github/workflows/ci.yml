name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# The checks here are the ones the suite passes locally. Two are deliberately absent and are debt:
# a full ruff lint of app/ and tests/ (173 findings at 0.10.0) and a pyright run (not a dependency).
jobs:
  check:
    runs-on: ubuntu-latest

    # The tests run in a dedicated database and refuse any other (tests/testdb.py). Migration 001
    # needs the vector extension, so the image is Postgres with pgvector.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ideascribe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VOXSCRIBE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ideascribe_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev --python 3.13

      - name: Undefined names in app/ (F821)
        run: uv run --extra dev ruff check app/ --select F821

      # Includes the contract drift check (tests/test_contract_drift.py).
      - name: Tests (no model, no microphone)
        run: uv run --extra dev pytest tests/ -q -m "not integration and not room"
